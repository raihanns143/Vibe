<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Original editorial typography artwork</title><desc id="desc">A geometric composition of oversized typography in red, cream, and charcoal.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e0e11"/><stop offset="1" stop-color="#1a1718"/></linearGradient><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".6"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><circle cx="1360" cy="170" r="240" fill="#dc2626" opacity=".12"/><path d="M0 720 520 170l560 550H0z" fill="#151519" stroke="#3a393e" stroke-width="2"/><path d="M520 170 1080 720 1180 280 690 70z" fill="#242128" stroke="#4e4b52" stroke-width="2"/><text x="125" y="342" fill="#29282c" font-family="Arial Black, Arial, sans-serif" font-size="194" font-weight="900" letter-spacing="-12">PRECISION</text><text x="125" y="578" fill="#f1eee9" font-family="Arial Black, Arial, sans-serif" font-size="126" font-weight="900" letter-spacing="-7">DESIGN</text><text x="125" y="676" fill="#dc2626" font-family="monospace" font-size="30" font-weight="700" letter-spacing="7">RHYTHM · BALANCE · CLARITY</text><g filter="url(#shadow)"><rect x="1020" y="535" width="400" height="190" rx="8" fill="#141417" stroke="#4c4a50"/><text x="1070" y="593" fill="#e8e3dd" font-family="monospace" font-size="22">01 / SYSTEM</text><text x="1070" y="634" fill="#9c9a9e" font-family="monospace" font-size="18">Intention over decoration.</text><text x="1070" y="665" fill="#9c9a9e" font-family="monospace" font-size="18">Every pixel earns its place.</text></g></svg>